site_name: Cadasto Plugin Marketplace
site_url: https://cadasto.github.io/plugin-marketplace/
# Fallback only: every page in `nav` carries its own `description` front matter,
# which the theme and the social-card generator both prefer. This is what a page
# added without one would inherit, and what 404.html shows.
site_description: >-
  Plugins that teach Claude Code and Cursor a specific job: openEHR modelling,
  spec-driven development, Go and PHP standards, and documentation.
repo_url: https://github.com/Cadasto/plugin-marketplace
repo_name: Cadasto/plugin-marketplace
# No `edit_uri`: pages built from fetched READMEs would point at this repo,
# which does not contain the prose.

docs_dir: pages

# Warnings are build failures. Both `make docs-build` and CI rely on this rather
# than passing --strict, so the two can never diverge.
strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Dark is the default (listed first). Fetched tokens.css defines both
    # scheme blocks, and `docs-check` asserts both.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  # Fonts are loaded via `extra_css` below. The theme loader cannot express
  # this brand: it binds two families, omits weight 500, and hardcodes
  # display=fallback. See Cadasto/docs-theme.
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.integrate

extra_css:
  # Weight list is coupled to the fetched CSS: Fira Sans at 500/700, Roboto at
  # 400/500/600/700 plus italic 400. The privacy plugin self-hosts this URL.
  - https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;700&family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap
  # Brand layer from Cadasto/docs-theme at the commit pinned in sources.json.
  # `make docs-sync` writes these. Do not edit them here.
  - stylesheets/tokens.css
  - stylesheets/material.css
  - stylesheets/landing.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cadasto/plugin-marketplace
    - icon: fontawesome/solid/globe
      link: https://www.cadasto.com
  generator: false

copyright: Cadasto B.V. · MIT License

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - Choose: choose.md
  - Plugins:
      - All plugins: plugins/index.md
      - openEHR Assistant: plugins/openehr-assistant.md
      - openEHR Assistant Dev: plugins/openehr-assistant-dev.md
      - Go coding standards: plugins/go-coding.md
      - PHP coding standards: plugins/php-coding.md
      - Spec-driven development: plugins/sdd.md
      - Docs editing: plugins/docs-editing.md
  - Install: install.md
  - Contributing: contributing.md
  - Contact: contact.md

plugins:
  - search
  - social:
      cards_layout_options:
        font_family: Roboto
        background_color: "#070e2b"
        color: "#ffffff"
  - privacy

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ['.fetched']
      check_paths: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
