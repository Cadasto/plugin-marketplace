<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cadasto Plugin Marketplace">
  <title>Cadasto Plugin Marketplace</title>
  <!-- Four tiles for a catalog. Geometry only: an SVG used as an img cannot
       load a webfont, so a wordmark would be illegible at favicon size. -->
  <defs>
    <linearGradient id="cadasto-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CB2FF"/>
      <stop offset="1" stop-color="#24E363"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cadasto-mark)"/>
  <g fill="none" stroke="#0A1A66" stroke-width="3.5">
    <rect x="14" y="14" width="14" height="14" rx="3"/>
    <rect x="36" y="14" width="14" height="14" rx="3"/>
    <rect x="14" y="36" width="14" height="14" rx="3"/>
    <rect x="36" y="36" width="14" height="14" rx="3"/>
  </g>
</svg>
