name: Docs CI

# Verification only. Never publishes. Pull requests into main run the same
# `make docs-check` that docs-site.yml runs before it deploys.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build and verify the site
        env:
          # php-coding-plugin is private. The default GITHUB_TOKEN cannot read
          # it. DOCS_SYNC_TOKEN is a fine-grained PAT with contents read on
          # that repository. See docs/site.md.
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: make docs-check
